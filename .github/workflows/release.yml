name: Release
# Push a tag like v0.1.0 to build the Linux archive and the Android APK and publish them.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        if: runner.arch == 'X64'
        with:
          channel: stable
      - name: Flutter (arm64: the action has no Linux arm64 build)
        if: runner.arch == 'ARM64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libdbus-1-dev rpm
      - run: flutter config --enable-linux-desktop
      - run: packaging/linux/build-release.sh
      - run: packaging/linux/make-packages.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.os }}
          path: |
            dist/stepaway-linux-*.tar.gz*
            dist/*.deb
            dist/*.rpm
            dist/packages-*.sha256
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get && flutter build apk --release
        working-directory: mobile
      - run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/stepaway-android.apk
          (cd dist && sha256sum stepaway-android.apk > stepaway-android.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/stepaway-android.apk*
  publish:
    needs: [linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
