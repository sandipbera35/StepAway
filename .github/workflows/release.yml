name: Release
# Push a tag like v0.1.0 to build the Linux archive and the Android APK and publish them.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in every component
        run: tools/version.sh check "${GITHUB_REF_NAME}"
  linux:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        if: runner.arch == 'X64'
        with:
          channel: stable
      - name: Flutter on arm64 (the action has no arm64 build)
        if: runner.arch == 'ARM64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libdbus-1-dev rpm
      - run: flutter config --enable-linux-desktop
      - run: packaging/linux/build-release.sh
      - run: packaging/linux/make-packages.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.os }}
          path: |
            dist/stepaway-linux-*.tar.gz*
            dist/*.deb
            dist/*.rpm
            dist/packages-*.sha256
  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Optional release signing: add these repository secrets (see packaging/android/PLAY_STORE.md).
      # Without them the build is signed with the debug key and is not accepted by Google Play.
      - name: Release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > mobile/android/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > mobile/android/key.properties
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key configured: the APK/AAB use the debug key"
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi
      - run: flutter pub get && flutter build apk --release && flutter build appbundle --release
        working-directory: mobile
      - run: |
          mkdir -p dist
          cp mobile/build/app/outputs/flutter-apk/app-release.apk dist/stepaway-android.apk
          cp mobile/build/app/outputs/bundle/release/app-release.aab dist/stepaway-android.aab
          (cd dist && sha256sum stepaway-android.apk stepaway-android.aab > stepaway-android.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/stepaway-android.apk
            dist/stepaway-android.aab
            dist/stepaway-android.sha256
  publish:
    needs: [linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
