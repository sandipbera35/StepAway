name: Release
# Push a tag like v0.1.0 to build the Linux packages and publish them.
# The Android app lives in a private repository and is not built or released here.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the version in every component
        run: tools/version.sh check "${GITHUB_REF_NAME}"
  linux:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        if: runner.arch == 'X64'
        with:
          channel: stable
      - name: Flutter on arm64 (the action has no arm64 build)
        if: runner.arch == 'ARM64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libdbus-1-dev rpm
      - run: flutter config --enable-linux-desktop
      - run: packaging/linux/build-release.sh
      - run: packaging/linux/make-packages.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.os }}
          path: |
            dist/stepaway-linux-*.tar.gz*
            dist/*.deb
            dist/*.rpm
            dist/packages-*.sha256
  publish:
    needs: [linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
